<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Threadly Storefront</title>
  
  <!-- React, ReactDOM, Babel & Tailwind CSS -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Framer Motion & Lucide Icons -->
  <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>
  <script src="https://unpkg.com/lucide-react@0.263.1/dist/umd/lucide-react.js"></script>

  <!-- Supabase JS Client CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0fdf4',
              100: '#dcfce7',
              500: '#22c55e',
              600: '#16a34a',
              700: '#15803d',
              900: '#052e16',
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      background-color: #0f172a;
      color: #f8fafc;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;
    const Motion = window.framerMotion ? window.framerMotion.motion : null;
    const AnimatePresence = window.framerMotion ? window.framerMotion.AnimatePresence : null;

    // TODO: Insert your actual Supabase URL and Anon/Public Key here
    const SUPABASE_URL = 'https://rckydmhxdgpuexewgtuz.supabase.co/';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJja3lkbWh4ZGdwdWV4ZXdndHV6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMyNjA2MjksImV4cCI6MjEwODgzNjYyOX0.z-3mAtuszG0vbYnt5QSY-xO7ybCWSxekdqEbcV2EMIY';
    const supabase = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

    // Lucide Icons
    const ShoppingBag = window.lucide ? window.lucide.ShoppingBag : () => null;
    const Heart = window.lucide ? window.lucide.Heart : () => null;
    const X = window.lucide ? window.lucide.X : () => null;
    const Plus = window.lucide ? window.lucide.Plus : () => null;
    const Minus = window.lucide ? window.lucide.Minus : () => null;
    const ArrowRight = window.lucide ? window.lucide.ArrowRight : () => null;
    const Sparkles = window.lucide ? window.lucide.Sparkles : () => null;
    const Home = window.lucide ? window.lucide.Home : () => null;
    const Compass = window.lucide ? window.lucide.Compass : () => null;

    function App() {
      const [products, setProducts] = useState([]);
      const [categories, setCategories] = useState(['All']);
      const [variantsMap, setVariantsMap] = useState({});
      const [loading, setLoading] = useState(true);
      const [activeTab, setActiveTab] = useState('home');
      const [selectedCategory, setSelectedCategory] = useState('All');
      const [cart, setCart] = useState([]);
      const [favorites, setFavorites] = useState([]);
      const [isCartOpen, setIsCartOpen] = useState(false);
      const [selectedProduct, setSelectedProduct] = useState(null);
      const [selectedSize, setSelectedSize] = useState('');
      const [promoCode, setPromoCode] = useState('');
      const [discount, setDiscount] = useState(0);
      const [toastMessage, setToastMessage] = useState(null);
      const [user, setUser] = useState(null);

      // Fetch categories, products, and variants from Supabase
      useEffect(() => {
        async function loadStoreData() {
          if (!supabase) {
            setLoading(false);
            return;
          }

          try {
            // Get current session user
            const { data: { session } } = await supabase.auth.getSession();
            if (session?.user) {
              setUser(session.user);
              // Fetch user wishlist
              const { data: wishData } = await supabase
                .from('wishlist')
                .select('product_id')
                .eq('user_id', session.user.id);
              if (wishData) setFavorites(wishData.map(w => w.product_id));
            }

            // Fetch categories
            const { data: catData } = await supabase.from('categories').select('*');
            if (catData) {
              setCategories(['All', ...catData.map(c => c.name)]);
            }

            // Fetch products and variants
            const { data: prodData } = await supabase
              .from('products')
              .select('*, categories(name), product_variants(*)')
              .eq('is_active', true);

            if (prodData) {
              setProducts(prodData);
              // Map variants by product ID
              const vMap = {};
              prodData.forEach(p => {
                vMap[p.id] = p.product_variants || [];
              });
              setVariantsMap(vMap);
            }
          } catch (err) {
            console.error('Error loading Supabase data:', err);
          } finally {
            setLoading(false);
          }
        }

        loadStoreData();
      }, []);

      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(null), 2500);
      };

      const toggleFavorite = async (product) => {
        if (!user) {
          showToast('Please sign in to save favorites');
          return;
        }
        const isFav = favorites.includes(product.id);
        if (isFav) {
          setFavorites(prev => prev.filter(id => id !== product.id));
          await supabase.from('wishlist').delete().match({ user_id: user.id, product_id: product.id });
          showToast('Removed from wishlist');
        } else {
          setFavorites(prev => [...prev, product.id]);
          await supabase.from('wishlist').insert({ user_id: user.id, product_id: product.id });
          showToast('Added to wishlist');
        }
      };

      const addToCart = (product, variant) => {
        if (!variant) {
          showToast('Please select a size/variant');
          return;
        }
        const cartItemId = variant.id;
        setCart(prev => {
          const existing = prev.find(item => item.cartItemId === cartItemId);
          if (existing) {
            return prev.map(item => item.cartItemId === cartItemId ? { ...item, qty: item.qty + 1 } : item);
          }
          return [...prev, {
            ...product,
            cartItemId,
            variantId: variant.id,
            selectedSize: variant.size,
            selectedColor: variant.color,
            qty: 1
          }];
        });
        showToast(`Added ${product.name} (${variant.size}) to bag`);
        setSelectedProduct(null);
      };

      const updateQty = (cartItemId, delta) => {
        setCart(prev => prev.map(item => {
          if (item.cartItemId === cartItemId) {
            const newQty = item.qty + delta;
            return newQty > 0 ? { ...item, qty: newQty } : null;
          }
          return item;
        }).filter(Boolean));
      };

      const subtotal = cart.reduce((sum, item) => sum + Number(item.price) * item.qty, 0);
      const total = Math.max(0, subtotal - discount);

      const applyPromo = () => {
        if (promoCode.toUpperCase() === 'THREAD10') {
          setDiscount(subtotal * 0.1);
          showToast('10% Promo applied!');
        } else if (promoCode.toUpperCase() === 'THREAD20') {
          setDiscount(subtotal * 0.2);
          showToast('20% Promo applied!');
        } else {
          showToast('Invalid promo code');
        }
      };

      // Handle checkout using Supabase RPC `place_order`[cite: 3]
      const handleCheckout = async () => {
        if (!user) {
          showToast('Please sign in to place an order');
          return;
        }
        if (cart.length === 0) return;

        try {
          const itemsPayload = cart.map(item => ({
            variant_id: item.variantId,
            qty: item.qty
          }));

          // Dummy sample address payload matching your schema requirements[cite: 3]
          const addressPayload = {
            name: user.user_metadata?.full_name || 'Valued Customer',
            phone: user.phone || '9999999999',
            line1: '123 Main Street',
            city: 'Hyderabad',
            state: 'Telangana',
            pincode: '500081'
          };

          const { data, error } = await supabase.rpc('place_order', {
            p_items: itemsPayload,
            p_address: addressPayload,
            p_method: 'razorpay'
          });

          if (error) {
            throw error;
          }

          showToast('Order placed successfully!');
          setCart([]);
          setIsCartOpen(false);
        } catch (err) {
          console.error('Checkout error:', err);
          showToast(err.message || 'Checkout failed');
        }
      };

      const filteredProducts = selectedCategory === 'All' 
        ? products 
        : products.filter(p => p.categories?.name === selectedCategory || p.category === selectedCategory);

      return (
        <div className="max-w-md mx-auto min-h-screen bg-slate-950 text-slate-100 relative pb-24 shadow-2xl overflow-hidden border-x border-slate-800">
          
          {/* Header */}
          <header className="sticky top-0 z-30 bg-slate-950/80 backdrop-blur-md border-b border-slate-800 px-5 py-4 flex items-center justify-between">
            <div className="flex items-center space-x-2">
              <div className="w-8 h-8 rounded-full bg-emerald-500 flex items-center justify-center font-bold text-slate-950 text-lg">
                T
              </div>
              <span className="font-extrabold text-xl tracking-tight bg-gradient-to-r from-emerald-400 to-teal-300 bg-clip-text text-transparent">
                threadly
              </span>
            </div>

            <button 
              onClick={() => setIsCartOpen(true)}
              className="relative p-2 text-slate-300 hover:text-emerald-400 transition"
            >
              <ShoppingBag size={22} />
              {cart.length > 0 && (
                <span className="absolute top-1 right-1 bg-emerald-500 text-slate-950 font-bold text-xs w-4 h-4 rounded-full flex items-center justify-center">
                  {cart.reduce((a, b) => a + b.qty, 0)}
                </span>
              )}
            </button>
          </header>

          {/* Toast Notification */}
          {toastMessage && (
            <div className="fixed top-16 left-1/2 -translate-x-1/2 z-50 bg-emerald-500 text-slate-950 px-4 py-2 rounded-full font-semibold text-xs shadow-lg flex items-center gap-2">
              <Sparkles size={14} /> {toastMessage}
            </div>
          )}

          {/* Main Content */}
          <main className="p-5 space-y-6">
            
            {/* Banner */}
            <div className="relative rounded-2xl overflow-hidden bg-gradient-to-br from-slate-900 to-slate-800 border border-slate-800 p-6 shadow-xl">
              <span className="text-xs uppercase tracking-widest text-emerald-400 font-bold">Supabase Live Sync</span>
              <h1 className="text-2xl font-black mt-1 mb-2">Streetwear Redefined</h1>
              <p className="text-slate-400 text-sm mb-4">Functional heavyweight essentials loaded directly from your database.</p>
            </div>

            {loading ? (
              <div className="text-center py-16 text-slate-400 text-xs animate-pulse">
                Syncing catalog from database...
              </div>
            ) : (
              <>
                {/* Category Chips */}
                <div className="flex gap-2 overflow-x-auto no-scrollbar py-1">
                  {categories.map(cat => (
                    <button
                      key={cat}
                      onClick={() => setSelectedCategory(cat)}
                      className={`px-4 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition ${
                        selectedCategory === cat 
                          ? 'bg-emerald-500 text-slate-950 shadow-lg shadow-emerald-500/20' 
                          : 'bg-slate-900 text-slate-400 border border-slate-800 hover:border-slate-700'
                      }`}
                    >
                      {cat}
                    </button>
                  ))}
                </div>

                {/* Product Grid */}
                <div className="grid grid-cols-2 gap-4">
                  {filteredProducts.map(product => {
                    const variants = variantsMap[product.id] || [];
                    const firstVariant = variants[0];

                    return (
                      <div 
                        key={product.id}
                        className="bg-slate-900/60 border border-slate-800/80 rounded-2xl overflow-hidden flex flex-col justify-between group"
                      >
                        <div className="relative aspect-square overflow-hidden bg-slate-950">
                          <img 
                            src={product.image_url || 'https://images.unsplash.com/photo-1521572267360-ee0c2909d518?w=800&auto=format&fit=crop&q=80'} 
                            alt={product.name} 
                            className="w-full h-full object-cover group-hover:scale-105 transition duration-500 cursor-pointer"
                            onClick={() => { setSelectedProduct(product); setSelectedSize(firstVariant); }}
                          />
                          <button 
                            onClick={() => toggleFavorite(product)}
                            className="absolute top-2.5 right-2.5 p-2 rounded-full bg-slate-950/60 backdrop-blur-md text-slate-300 hover:text-rose-500 transition"
                          >
                            <Heart size={15} className={favorites.includes(product.id) ? "fill-rose-500 text-rose-500" : ""} />
                          </button>
                          {product.is_new && (
                            <span className="absolute top-2.5 left-2.5 bg-emerald-500/90 text-slate-950 text-[10px] font-extrabold px-2 py-0.5 rounded-md backdrop-blur-sm">
                              NEW
                            </span>
                          )}
                        </div>

                        <div className="p-3 flex-1 flex flex-col justify-between">
                          <div>
                            <span className="text-[10px] text-slate-500 uppercase tracking-wider">{product.categories?.name || 'Apparel'}</span>
                            <h3 
                              onClick={() => { setSelectedProduct(product); setSelectedSize(firstVariant); }}
                              className="text-xs font-bold text-slate-200 line-clamp-1 cursor-pointer hover:text-emerald-400 transition"
                            >
                              {product.name}
                            </h3>
                          </div>

                          <div className="mt-3 flex items-center justify-between">
                            <span className="text-sm font-extrabold text-slate-100">${product.price}</span>
                            <button 
                              onClick={() => addToCart(product, firstVariant)}
                              className="p-2 bg-slate-800 hover:bg-emerald-500 hover:text-slate-950 rounded-xl transition text-slate-300"
                            >
                              <Plus size={14} />
                            </button>
                          </div>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </>
            )}
          </main>

          {/* Quick-View Modal */}
          {selectedProduct && (
            <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-md flex items-end justify-center p-0">
              <div className="bg-slate-900 border-t border-slate-800 rounded-t-3xl w-full max-w-md p-6 space-y-4 max-h-[85vh] overflow-y-auto no-scrollbar">
                <div className="flex justify-between items-center">
                  <span className="text-xs font-bold text-emerald-400 uppercase">Select Variant</span>
                  <button onClick={() => setSelectedProduct(null)} className="p-1 text-slate-400 hover:text-white">
                    <X size={20} />
                  </button>
                </div>

                <img src={selectedProduct.image_url} className="w-full h-56 object-cover rounded-2xl" />

                <div>
                  <h2 className="text-lg font-extrabold text-slate-100">{selectedProduct.name}</h2>
                  <p className="text-xl font-black text-emerald-400 mt-1">${selectedProduct.price}</p>
                  <p className="text-xs text-slate-400 mt-2 leading-relaxed">{selectedProduct.description}</p>
                </div>

                <div>
                  <label className="text-xs text-slate-400 font-bold block mb-2">Available Size & Color</label>
                  <div className="flex flex-wrap gap-2">
                    {(variantsMap[selectedProduct.id] || []).map(v => (
                      <button
                        key={v.id}
                        onClick={() => setSelectedSize(v)}
                        className={`px-3 py-1.5 text-xs font-semibold rounded-lg border transition ${
                          selectedSize?.id === v.id
                            ? 'bg-emerald-500 text-slate-950 border-emerald-500 font-bold'
                            : 'bg-slate-800 text-slate-300 border-slate-700'
                        }`}
                      >
                        {v.size} / {v.color} ({v.stock} left)
                      </button>
                    ))}
                  </div>
                </div>

                <button 
                  onClick={() => addToCart(selectedProduct, selectedSize)}
                  className="w-full bg-emerald-500 text-slate-950 font-bold py-3 rounded-xl text-sm shadow-lg shadow-emerald-500/20 hover:bg-emerald-400 transition"
                >
                  Add to Shopping Bag
                </button>
              </div>
            </div>
          )}

          {/* Cart Drawer */}
          {isCartOpen && (
            <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-md flex justify-end">
              <div className="bg-slate-900 w-full max-w-md h-full flex flex-col justify-between p-6 shadow-2xl border-l border-slate-800">
                <div className="flex justify-between items-center border-b border-slate-800 pb-4">
                  <div className="flex items-center gap-2">
                    <ShoppingBag className="text-emerald-400" size={20} />
                    <h2 className="font-bold text-slate-100">Your Bag ({cart.length})</h2>
                  </div>
                  <button onClick={() => setIsCartOpen(false)} className="p-1 text-slate-400 hover:text-white">
                    <X size={20} />
                  </button>
                </div>

                {/* Cart Items */}
                <div className="flex-1 overflow-y-auto my-4 space-y-4 no-scrollbar">
                  {cart.length === 0 ? (
                    <div className="text-center py-12 text-slate-500 text-xs">
                      Your shopping bag is empty.
                    </div>
                  ) : (
                    cart.map(item => (
                      <div key={item.cartItemId} className="flex gap-3 bg-slate-950/50 p-3 rounded-xl border border-slate-800/80">
                        <img src={item.image_url} className="w-16 h-16 object-cover rounded-lg" />
                        <div className="flex-1">
                          <h4 className="text-xs font-bold text-slate-200 line-clamp-1">{item.name}</h4>
                          <span className="text-[10px] text-slate-400">Size: {item.selectedSize} | {item.selectedColor}</span>
                          <div className="flex items-center justify-between mt-2">
                            <span className="text-xs font-extrabold text-emerald-400">${item.price * item.qty}</span>
                            <div className="flex items-center gap-2 bg-slate-900 px-2 py-1 rounded-lg border border-slate-800">
                              <button onClick={() => updateQty(item.cartItemId, -1)} className="text-slate-400 hover:text-white">
                                <Minus size={12} />
                              </button>
                              <span className="text-xs font-bold">{item.qty}</span>
                              <button onClick={() => updateQty(item.cartItemId, 1)} className="text-slate-400 hover:text-white">
                                <Plus size={12} />
                              </button>
                            </div>
                          </div>
                        </div>
                      </div>
                    ))
                  )}
                </div>

                {/* Checkout Section */}
                <div className="border-t border-slate-800 pt-4 space-y-3">
                  <div className="flex gap-2">
                    <input 
                      type="text" 
                      placeholder="Promo (THREAD10)" 
                      value={promoCode} 
                      onChange={e => setPromoCode(e.target.value)}
                      className="bg-slate-950 border border-slate-800 text-xs px-3 py-2 rounded-xl text-slate-200 focus:outline-none focus:border-emerald-500 flex-1 uppercase"
                    />
                    <button onClick={applyPromo} className="bg-slate-800 text-slate-200 px-3 py-2 rounded-xl text-xs font-bold hover:bg-slate-700">
                      Apply
                    </button>
                  </div>

                  <div className="space-y-1.5 text-xs text-slate-400">
                    <div className="flex justify-between">
                      <span>Subtotal</span>
                      <span className="text-slate-200">${subtotal.toFixed(2)}</span>
                    </div>
                    {discount > 0 && (
                      <div className="flex justify-between text-emerald-400">
                        <span>Discount</span>
                        <span>-${discount.toFixed(2)}</span>
                      </div>
                    )}
                    <div className="flex justify-between text-sm font-bold text-slate-100 pt-2 border-t border-slate-800">
                      <span>Total</span>
                      <span className="text-emerald-400">${total.toFixed(2)}</span>
                    </div>
                  </div>

                  <button 
                    disabled={cart.length === 0}
                    onClick={handleCheckout}
                    className="w-full bg-emerald-500 disabled:opacity-50 text-slate-950 font-bold py-3 rounded-xl text-xs tracking-wider uppercase shadow-lg shadow-emerald-500/20"
                  >
                    Complete Checkout
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Bottom Mobile Navigation */}
          <nav className="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-md bg-slate-950/90 backdrop-blur-lg border-t border-slate-800/80 px-6 py-3 flex justify-around items-center z-40">
            <button onClick={() => setActiveTab('home')} className={`flex flex-col items-center gap-1 ${activeTab === 'home' ? 'text-emerald-400' : 'text-slate-500'}`}>
              <Home size={20} />
              <span className="text-[10px] font-semibold">Home</span>
            </button>
            <button onClick={() => setActiveTab('explore')} className={`flex flex-col items-center gap-1 ${activeTab === 'explore' ? 'text-emerald-400' : 'text-slate-500'}`}>
              <Compass size={20} />
              <span className="text-[10px] font-semibold">Explore</span>
            </button>
          </nav>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
